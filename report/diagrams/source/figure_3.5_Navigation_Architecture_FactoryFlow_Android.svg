<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b728c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#547064"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7b61b8"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 0.6px; fill: #476683; }
      .section-title { font-size: 14px; font-weight: 700; letter-spacing: 1.1px; }
      .section-context { font-size: 13px; font-weight: 400; }
      .group-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .card-title { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .card-title-sm { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-subtitle { font-size: 13px; font-weight: 400; text-anchor: middle; fill: #5c6b7b; }
      .connector { fill: none; stroke: #5b728c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .connector-green { fill: none; stroke: #547064; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .connector-purple { fill: none; stroke: #7b61b8; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 6 5; marker-end: url(#arrow-purple); }
      .plain-line { fill: none; stroke: #5b728c; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .plain-line-green { fill: none; stroke: #547064; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
