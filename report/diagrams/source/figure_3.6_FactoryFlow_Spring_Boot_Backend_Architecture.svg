<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800" role="img" aria-labelledby="title desc">
  <title id="title">Layered and modular architecture of the FactoryFlow Spring Boot backend</title>
  <desc id="desc">FactoryFlow Android enters one modular Spring Boot backend through the API layer. The backend contains application and business modules, a domain layer, and infrastructure adapters connected to PostgreSQL, PaddleOCR, generated report storage, and SMTP. Quartz triggers reporting and scheduling.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324D" flood-opacity="0.12"/></filter>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#244766"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3277B3"/></marker>
    <style>
      .font { font-family: Inter, Arial, sans-serif; fill: #17324D; }
      .section-title { font-size: 27px; font-weight: 700; letter-spacing: 1.1px; }
      .module-title { font-size: 26px; font-weight: 650; }
      .module-subtitle { font-size: 20px; font-weight: 450; fill: #5D6D7C; }
      .external-title { font-size: 22px; font-weight: 650; }
      .small-label { font-size: 18px; font-weight: 600; fill: #52677A; }
      .connector { fill: none; stroke: #244766; stroke-width: 4; marker-end: url(#arrowNavy); }
      .connector-blue { fill: none; stroke: #3277B3; stroke-width: 4; marker-end: url(#arrowBlue); }
      .connector-dashed { fill: none; stroke: #A56A14; stroke-width: 4; stroke-dasharray: 10 9; marker-end: url(#arrowNavy); }
    </style>
  </defs>
  <rect width="1400" height="1800" fill="#FFFFFF"/>

