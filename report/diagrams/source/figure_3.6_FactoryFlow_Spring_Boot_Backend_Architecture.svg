    <rect x="720" y="530" width="555" height="92" rx="16" fill="#FFFFFF" stroke="#B5A5E3" stroke-width="2"/><text x="997" y="568" text-anchor="middle" class="font module-title">Acquisition &amp; Validation</text><text x="997" y="597" text-anchor="middle" class="font module-subtitle">Review preparation and confirmation</text>
