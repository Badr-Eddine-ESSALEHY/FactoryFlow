    <rect x="125" y="766" width="555" height="92" rx="16" fill="#FFFFFF" stroke="#B5A5E3" stroke-width="2"/><text x="402" y="804" text-anchor="middle" class="font module-title">Statistics &amp; History</text><text x="402" y="833" text-anchor="middle" class="font module-subtitle">Historical KPI consultation</text>
    <rect x="720" y="766" width="555" height="92" rx="16" fill="#FFFFFF" stroke="#B5A5E3" stroke-width="2"/><text x="997" y="804" text-anchor="middle" class="font module-title">Maintenance Intelligence</text><text x="997" y="833" text-anchor="middle" class="font module-subtitle">Validated historical KPI analysis</text>
    <rect x="125" y="884" width="555" height="92" rx="16" fill="#FFFFFF" stroke="#B5A5E3" stroke-width="2"/><text x="402" y="922" text-anchor="middle" class="font module-title">Reporting &amp; Scheduling</text><text x="402" y="951" text-anchor="middle" class="font module-subtitle">Documents and automation</text>
    <rect x="720" y="884" width="555" height="92" rx="16" fill="#FFFFFF" stroke="#B5A5E3" stroke-width="2"/><text x="997" y="922" text-anchor="middle" class="font module-title">Notifications</text><text x="997" y="951" text-anchor="middle" class="font module-subtitle">State and delivery workflows</text>
  </g>
  <rect x="172" y="1015" width="270" height="60" rx="30" fill="#FFF2CF" stroke="#D49A35" stroke-width="2.5"/><circle cx="208" cy="1045" r="15" fill="#D49A35"/><path d="M208 1035 V1045 L216 1051" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="335" y="1053" text-anchor="middle" class="font" font-size="21" font-weight="700">Quartz timing</text><path d="M307 1015 V990" class="connector-dashed"/><text x="460" y="1053" class="font small-label" fill="#8A5D14">triggers only</text>
  <path d="M700 1128 V1160" class="connector"/><text x="722" y="1152" class="font small-label">applies rules</text>

