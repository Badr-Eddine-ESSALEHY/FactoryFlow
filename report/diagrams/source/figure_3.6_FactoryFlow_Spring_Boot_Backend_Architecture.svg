  <text x="125" y="1207" class="font section-title" fill="#357E45">DOMAIN LAYER</text>
  <rect x="190" y="1225" width="1020" height="50" rx="14" fill="#FFFFFF" stroke="#A8DDB2" stroke-width="2"/>
  <text x="700" y="1258" text-anchor="middle" class="font module-title">Business entities   •   Domain rules   •   Validated KPI information</text>
  <path d="M700 1296 V1328" class="connector"/><text x="722" y="1320" class="font small-label">through ports</text>

  <rect x="90" y="1336" width="1220" height="142" rx="20" fill="#FFF6E3" stroke="#DFB05B" stroke-width="2.5"/>
  <text x="125" y="1375" class="font section-title" fill="#98651C">INFRASTRUCTURE &amp; DATA ACCESS</text>
