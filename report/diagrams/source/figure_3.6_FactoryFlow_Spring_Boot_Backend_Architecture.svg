  <rect x="415" y="1396" width="275" height="56" rx="13" fill="#FFFFFF" stroke="#E5C98F" stroke-width="2"/><text x="552" y="1432" text-anchor="middle" class="font" font-size="21" font-weight="650">OCR Provider Adapter</text>
  <rect x="712" y="1396" width="275" height="56" rx="13" fill="#FFFFFF" stroke="#E5C98F" stroke-width="2"/><text x="849" y="1432" text-anchor="middle" class="font" font-size="21" font-weight="650">Report Storage Adapter</text>
  <rect x="1009" y="1396" width="275" height="56" rx="13" fill="#FFFFFF" stroke="#E5C98F" stroke-width="2"/><text x="1146" y="1432" text-anchor="middle" class="font" font-size="21" font-weight="650">Email Adapter</text>
  <path d="M255 1478 V1550" class="connector"/><path d="M552 1478 V1550" class="connector-blue"/><path d="M849 1478 V1550" class="connector"/><path d="M1146 1478 V1550" class="connector"/><text x="552" y="1523" text-anchor="middle" class="font small-label">text extraction only</text>

