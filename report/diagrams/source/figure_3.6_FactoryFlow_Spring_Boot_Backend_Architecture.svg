  <circle cx="480" cy="70" r="23" fill="#3F8FCC"/><rect x="469" y="52" width="22" height="36" rx="4" fill="#FFFFFF"/><circle cx="480" cy="82" r="2.5" fill="#3F8FCC"/>
  <text x="720" y="79" text-anchor="middle" class="font" font-size="28" font-weight="700">FACTORYFLOW ANDROID</text>
  <path d="M700 112 V166" class="connector-blue"/><rect x="575" y="122" width="250" height="30" rx="15" fill="#FFFFFF"/><text x="700" y="143" text-anchor="middle" class="font small-label">REST / JSON / HTTPS</text>

  <g filter="url(#shadow)"><rect x="48" y="170" width="1304" height="1338" rx="30" fill="#F7F9FC" stroke="#244766" stroke-width="4"/></g>
  <path d="M78 170 H1322 Q1352 170 1352 200 V252 H48 V200 Q48 170 78 170 Z" fill="#17324D"/>
  <text x="700" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="1" fill="#FFFFFF">FACTORYFLOW SPRING BOOT BACKEND</text>

  <rect x="90" y="282" width="1220" height="138" rx="20" fill="#EAF5FF" stroke="#75B6E8" stroke-width="2.5"/>
  <text x="125" y="321" class="font section-title" fill="#2B6F9F">API LAYER</text>
  <rect x="190" y="341" width="1020" height="56" rx="14" fill="#FFFFFF" stroke="#A9D2F0" stroke-width="2"/>
  <text x="700" y="377" text-anchor="middle" class="font module-title">REST Controllers   •   Request Validation   •   API DTOs</text>
  <path d="M700 420 V454" class="connector"/><text x="722" y="446" class="font small-label">delegates</text>

