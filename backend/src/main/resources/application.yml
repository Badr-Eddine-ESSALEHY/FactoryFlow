spring:
  application:
    name: factoryflow-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: FactoryFlowScheduler
      org.quartz.threadPool.threadCount: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

factoryflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  parser:
    fuzzy-threshold: ${PARSER_FUZZY_THRESHOLD:0.82}
    fuzzy-ambiguity-margin: ${PARSER_FUZZY_AMBIGUITY_MARGIN:0.04}
    suggestion-threshold: ${PARSER_SUGGESTION_THRESHOLD:0.45}
  reports:
    storage-root: ${REPORT_STORAGE_ROOT:./data/generated-reports}
  mail:
    from: ${MAIL_FROM:}
