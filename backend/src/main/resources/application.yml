spring:
  application:
    name: factoryflow-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: FactoryFlowScheduler
      org.quartz.threadPool.threadCount: 2
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
  servlet:
    multipart:
      max-file-size: ${OCR_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${OCR_MAX_UPLOAD_SIZE:10MB}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

factoryflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  parser:
    fuzzy-threshold: ${PARSER_FUZZY_THRESHOLD:0.82}
    fuzzy-ambiguity-margin: ${PARSER_FUZZY_AMBIGUITY_MARGIN:0.04}
    suggestion-threshold: ${PARSER_SUGGESTION_THRESHOLD:0.45}
    strong-suggestion-threshold: ${PARSER_STRONG_SUGGESTION_THRESHOLD:0.70}
  reports:
    storage-root: ${REPORT_STORAGE_ROOT:./data/generated-reports}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  ocr:
    runtime-url: ${OCR_RUNTIME_URL:http://127.0.0.1:8091}
    connect-timeout: ${OCR_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${OCR_REQUEST_TIMEOUT:PT45S}
    max-upload-bytes: ${OCR_MAX_UPLOAD_BYTES:10485760}
  intelligence:
    runtime-url: ${INTELLIGENCE_RUNTIME_URL:http://127.0.0.1:8092}
    connect-timeout: ${INTELLIGENCE_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${INTELLIGENCE_REQUEST_TIMEOUT:PT120S}
    anomaly-minimum-history: ${INTELLIGENCE_ANOMALY_MINIMUM_HISTORY:12}
    anomaly-estimators: ${INTELLIGENCE_ANOMALY_ESTIMATORS:200}
    anomaly-random-state: ${INTELLIGENCE_ANOMALY_RANDOM_STATE:42}
    anomaly-rolling-window: ${INTELLIGENCE_ANOMALY_ROLLING_WINDOW:5}
    forecast-minimum-history: ${INTELLIGENCE_FORECAST_MINIMUM_HISTORY:8}
    forecast-horizon: ${INTELLIGENCE_FORECAST_HORIZON:7}
    backtest-minimum-training: ${INTELLIGENCE_BACKTEST_MINIMUM_TRAINING:6}
    backtest-minimum-folds: ${INTELLIGENCE_BACKTEST_MINIMUM_FOLDS:3}
    backtest-maximum-folds: ${INTELLIGENCE_BACKTEST_MAXIMUM_FOLDS:8}
    seasonal-period: ${INTELLIGENCE_SEASONAL_PERIOD:7}
    seasonal-minimum-cycles: ${INTELLIGENCE_SEASONAL_MINIMUM_CYCLES:3}
    interval-confidence: ${INTELLIGENCE_INTERVAL_CONFIDENCE:0.95}
  intelligence-execution:
    core-pool-size: ${INTELLIGENCE_EXECUTION_CORE_POOL_SIZE:1}
    max-pool-size: ${INTELLIGENCE_EXECUTION_MAX_POOL_SIZE:2}
    queue-capacity: ${INTELLIGENCE_EXECUTION_QUEUE_CAPACITY:100}
