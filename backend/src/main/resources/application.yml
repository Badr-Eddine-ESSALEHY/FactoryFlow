spring:
  application:
    name: factoryflow-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: FactoryFlowScheduler
      org.quartz.threadPool.threadCount: 2
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
  servlet:
    multipart:
      max-file-size: ${OCR_MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${OCR_MAX_UPLOAD_SIZE:10MB}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

factoryflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
  parser:
    fuzzy-threshold: ${PARSER_FUZZY_THRESHOLD:0.82}
    fuzzy-ambiguity-margin: ${PARSER_FUZZY_AMBIGUITY_MARGIN:0.04}
    suggestion-threshold: ${PARSER_SUGGESTION_THRESHOLD:0.45}
    strong-suggestion-threshold: ${PARSER_STRONG_SUGGESTION_THRESHOLD:0.70}
  reports:
    storage-root: ${REPORT_STORAGE_ROOT:./data/generated-reports}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  ocr:
    runtime-url: ${OCR_RUNTIME_URL:http://127.0.0.1:8091}
    connect-timeout: ${OCR_CONNECT_TIMEOUT:PT3S}
    request-timeout: ${OCR_REQUEST_TIMEOUT:PT45S}
    max-upload-bytes: ${OCR_MAX_UPLOAD_BYTES:10485760}
