factoryflow:
  security:
    jwt:
      secret: factoryflow-test-only-jwt-secret-32-characters
      access-token-ttl: PT15M
  reports:
    storage-root: target/test-generated-reports
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/factoryflow_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
  flyway:
    enabled: true
  quartz:
    auto-startup: false
